g-surface font-body-md text-on-surface antialiased pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface flex-1"><div class="flex flex-col w-full relative select-none overflow-hidden" style="background-color: #07080C; min-height: 844px;">

<!-- Center Upper Visual: Relativistic Singularity Graphic -->

<div class="relative w-[280px] h-[280px] flex items-center justify-center">
<!-- Lensing Distortion Ring SVG -->
<svg class="absolute inset-0 w-full h-full animate-[spin_120s_linear_infinite]" fill="none" viewBox="0 0 280 280">
<!-- External Telemetry Calibration Rings -->
<circle cx="140" cy="140" r="132" stroke="#2A2F3A" stroke-dasharray="2 6" stroke-width="0.75"></circle>
<circle cx="140" cy="140" r="118" stroke="#2A2F3A" stroke-width="0.75"></circle>
<circle cx="140" cy="140" r="88" stroke="#8A8F98" stroke-dasharray="3 9" stroke-opacity="0.3" stroke-width="0.5"></circle>
<!-- Crosshairs & Coordinate ticks -->
<line stroke="#8A8F98" stroke-width="1" x1="140" x2="140" y1="2" y2="12"></line>
<line stroke="#8A8F98" stroke-width="1" x1="140" x2="140" y1="268" y2="278"></line>
<line stroke="#8A8F98" stroke-width="1" x1="2" x2="12" y1="140" y2="140"></line>
<line stroke="#8A8F98" stroke-width="1" x1="268" x2="278" y1="140" y2="140"></line>
<!-- Gravitational Arc Warping Behind Singularity -->
<ellipse cx="140" cy="132" filter="url(#glow-sm)" rx="108" ry="46" stroke="#FF9A4D" stroke-opacity="0.65" stroke-width="2.5"></ellipse>

</svg>
<!-- Doppler Beamed Accretion Halo (Asymmetric luminous distortion) -->
<div class="absolute w-[220px] h-[84px] -rotate-12 pointer-events-none flex items-center justify-center">

<!-- Receding disc side -->
<div class="absolute right-0 w-3/5 h-full rounded-full blur-lg opacity-40" style="background: radial-gradient(ellipse at 70% 50%, #FF9A4D 0%, rgba(255,154,77,0.1) 60%, transparent 100%);"></div>
</div>
<!-- Foreground Accretion Disc Sweep -->
<div class="absolute w-[236px] h-[52px] -rotate-12 rounded-[50%] border-t-2 border-[#FF9A4D] shadow-[0_0_12px_#FF9A4D] opacity-95 pointer-events-none"></div>
<!-- Event Horizon Void (Total Optical Ingestion) -->
<div class="relative w-[104px] h-[104px] rounded-full z-10 flex items-center justify-center" style="background-color: rgb(0, 0, 0); border-radius: 50%; box-shadow: rgba(255, 154, 77, 0.85) 0px 0px 0px 1.5px, rgba(255, 154, 77, 0.45) 0px 0px 16px 2px, rgb(0, 0, 0) 0px 0px 32px 10px, rgb(0, 0, 0) 0px 0px 14px inset;"><div class="w-full h-full rounded-full border border-[#EDEAE4]/70 pointer-events-none" style="border-radius: 50%;"></div><div class="absolute w-1 h-1 rounded-full bg-[#EDEAE4]/70" style="border-radius: 50%;"></div></div>
<!-- Radius Metrics & Mathematical Callouts -->


</div>
</div>
<!-- Title Treatment & Observation Log Sequence -->
<div class="flex flex-col items-center text-center mt-2 mb-6">

<span class="font-label-md text-label-md uppercase tracking-[0.25em] text-[#FF9A4D]">DEEP SPACE SURVEY</span>
<span class="w-2 h-[1px] bg-[#FF9A4D]"></span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile uppercase tracking-[0.08em] text-[#EDEAE4] m-0 leading-none">

      </h1>

        EVENT HORIZON
      </h2>

</div>

<!-- Primary Action: Initialize Log -->
<button class="group relative w-full py-3.5 px-6 rounded transition-all duration-150 active:scale-[0.98] flex items-center justify-center gap-2 overflow-hidden shadow-[0_0_16px_rgba(255,154,77,0.35)]" id="btn-initialize" style="background-color: #FF9A4D;" type="button"><span class="absolute top-0 left-0 w-1.5 h-1.5 bg-[#07080C] pointer-events-none"></span><span class="absolute top-0 right-0 w-1.5 h-1.5 bg-[#07080C] pointer-events-none"></span><span class="absolute bottom-0 left-0 w-1.5 h-1.5 bg-[#07080C] pointer-events-none"></span><span class="absolute bottom-0 right-0 w-1.5 h-1.5 bg-[#07080C] pointer-events-none"></span><span class="font-headline-md text-headline-md tracking-[0.14em] uppercase font-bold text-[#07080C] pt-0.5">PLAY</span><span class="material-symbols-outlined text-[#07080C] text-[18px]">play_arrow</span></button>

<script>
  (function () {
    // Canvas background: subtle pinpoint starfield with subtle drift
    const canvas = document.getElementById('singularity-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    let stars = [];
    const starCount = 65;

    function resize() {
      canvas.width = canvas.parentElement.clientWidth || 390;
      canvas.height = canvas.parentElement.clientHeight || 844;
      initStars();
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 0.9 + 0.2,
          alpha: Math.random() * 0.7 + 0.15,
          twinkleSpeed: Math.random() * 0.015 + 0.005,
          direction: Math.random() > 0.5 ? 1 : -1
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Subtle engineering grid cross-ticks
      ctx.strokeStyle = 'rgba(42, 47, 58, 0.35)';
      ctx.lineWidth = 0.5;

      // Draw faint star points
      for (let i = 0; i < stars.length; i++) {
        const star = stars[i];
        star.alpha += star.twinkleSpeed * star.direction;
        if (star.alpha > 0.85 || star.alpha < 0.15) {
          star.direction *= -1;
        }

        ctx.fillStyle = `rgba(237, 234, 228, ${star.alpha})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw delicate corner reticle notches
      const w = canvas.width;
      const h = canvas.height;
      const notch = 12;

      ctx.strokeStyle = 'rgba(138, 143, 152, 0.25)';
      // Top-left
      ctx.beginPath();
      ctx.moveTo(12, 12 + notch);
      ctx.lineTo(12, 12);
      ctx.lineTo(12 + notch, 12);
      ctx.stroke();

      // Top-right
      ctx.beginPath();
      ctx.moveTo(w - 12 - notch, 12);
      ctx.lineTo(w - 12, 12);
      ctx.lineTo(w - 12, 12 + notch);
      ctx.stroke();

      // Bottom-left
      ctx.beginPath();
      ctx.moveTo(12, h - 12 - notch);
      ctx.lineTo(12, h - 12);
      ctx.lineTo(12 + notch, h - 12);
      ctx.stroke();

      // Bottom-right
      ctx.beginPath();
      ctx.moveTo(w - 12 - notch, h - 12);
      ctx.lineTo(w - 12, h - 12);
      ctx.lineTo(w - 12, h - 12 - notch);
      ctx.stroke();

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();

    // Tactile button acoustic simulation via micro audio context
    const initializeBtn = document.getElementById('btn-initialize');
    if (initializeBtn) {
      initializeBtn.addEventListener('click', function () {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            const actx = new AudioContext();
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, actx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(42, actx.currentTime + 0.14);
            gain.gain.setValueAtTime(0.2, actx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.14);
            osc.connect(gain);
            gain.connect(actx.destination);
            osc.start();
            osc.stop(actx.currentTime + 0.15);
          }
        } catch (e) {}
      });
    }
  })();
</script></main>
