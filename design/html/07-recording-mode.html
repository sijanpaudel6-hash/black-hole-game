<script>
  (function() {
    // 1. Monospace Timer & Telemetry Logic
    let startTime = performance.now() - 14820; // Pre-start at 14.82s
    let baseMass = 1.0842;
    const timerElem = document.getElementById('rec-timer');
    const massElem = document.getElementById('mass-counter');
    const progressElem = document.getElementById('mass-progress');

    function updateMetrics(now) {
      const elapsed = (now - startTime) / 1000;
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(Math.floor(elapsed % 60)).padStart(2, '0');
      const ms = String(Math.floor((elapsed % 1) * 100)).padStart(2, '0');
      if (timerElem) {
        timerElem.textContent = `${mins}:${secs}.${ms}`;
      }

      // Smooth mass accretion simulation
      const currentMass = baseMass + (elapsed - 14.82) * 0.0031;
      if (massElem) {
        massElem.textContent = currentMass.toFixed(3);
      }
      if (progressElem) {
        const pct = Math.min(100, Math.max(0, (currentMass / 2.5) * 100));
        progressElem.style.width = pct.toFixed(2) + '%';
      }

      requestAnimationFrame(updateMetrics);
    }
    requestAnimationFrame(updateMetrics);

    // 2. High-Precision Accretion Disc & Singularity Physics Canvas
    const canvas = document.getElementById('singularity-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Particle field orbiting into the singularity
    const particles = [];
    const PARTICLE_COUNT = 160;
    const CENTER_OFFSET_Y = 0.02; // slight visual rebalance

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(resetParticle({}));
    }

    function resetParticle(p) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 70 + Math.random() * 220;
      p.angle = angle;
      p.dist = dist;
      p.speed = (0.015 + Math.random() * 0.025) * (180 / (dist + 30));
      p.size = 0.6 + Math.random() * 1.8;
      p.hue = Math.random() > 0.4 ? 'amber' : 'blue';
      p.opacity = 0.2 + Math.random() * 0.8;
      p.radialSpeed = 0.25 + Math.random() * 0.45;
      return p;
    }

    let globalRotation = 0;

    function draw() {
      ctx.clearRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2 + (height * CENTER_OFFSET_Y);
      const eventHorizonRadius = 42;

      // Accretion Disc Tilt and Relativistic Lensing Effect
      ctx.save();
      ctx.translate(cx, cy);

      // Deep Gravitational Glow (Background lensing aura)
      const outerGlow = ctx.createRadialGradient(0, 0, eventHorizonRadius, 0, 0, 180);
      outerGlow.addColorStop(0, 'rgba(255, 154, 77, 0.4)');
      outerGlow.addColorStop(0.35, 'rgba(255, 183, 133, 0.12)');
      outerGlow.addColorStop(0.7, 'rgba(163, 201, 255, 0.05)');
      outerGlow.addColorStop(1, 'rgba(7, 8, 12, 0)');
      ctx.fillStyle = outerGlow;
      ctx.beginPath();
      ctx.arc(0, 0, 190, 0, Math.PI * 2);
      ctx.fill();

      // Relativistic Lensing Arcs (Upper and lower secondary images)
      ctx.save();
      ctx.scale(1, 0.38);
      ctx.rotate(-0.25);

      // Lensing Ring 1
      ctx.lineWidth = 14;
      ctx.strokeStyle = 'rgba(255, 183, 133, 0.15)';
      ctx.beginPath();
      ctx.arc(0, 0, 120, 0, Math.PI * 2);
      ctx.stroke();

      // Intense Accretion Ring Primary Core
      const ringGrad = ctx.createRadialGradient(0, 0, 48, 0, 0, 110);
      ringGrad.addColorStop(0, 'rgba(255, 240, 220, 0.95)');
      ringGrad.addColorStop(0.25, 'rgba(255, 154, 77, 0.85)');
      ringGrad.addColorStop(0.7, 'rgba(255, 110, 30, 0.3)');
      ringGrad.addColorStop(1, 'rgba(255, 80, 0, 0)');

      ctx.lineWidth = 26;
      ctx.strokeStyle = ringGrad;
      ctx.beginPath();
      ctx.arc(0, 0, 78, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Dynamic Infalling Particles & Filament Streams
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.angle += p.speed;
        p.dist -= p.radialSpeed;

        if (p.dist <= eventHorizonRadius - 2) {
          resetParticle(p);
        }

        // Particle Coordinates projected on elliptical accretion plane
        const px = Math.cos(p.angle) * p.dist;
        const py = Math.sin(p.angle) * (p.dist * 0.36);

        // Doppler boost: brighter on left side moving toward observer
        const dopplerBoost = Math.sin(p.angle) < 0 ? 1.25 : 0.65;
        const alpha = Math.min(1, Math.max(0, p.opacity * dopplerBoost));

        ctx.fillStyle = p.hue === 'amber'
          ? `rgba(255, 183, 133, ${alpha})`
          : `rgba(163, 201, 255, ${alpha * 0.7})`;

        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fill();

        // Infalling accretion trace filament
        if (p.dist < 110) {
          const tailX = Math.cos(p.angle - p.speed * 2) * (p.dist + 3);
          const tailY = Math.sin(p.angle - p.speed * 2) * ((p.dist + 3) * 0.36);
          ctx.strokeStyle = `rgba(255, 154, 77, ${alpha * 0.35})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();
        }
      }

      // Event Horizon (Absolute Singularity Void)
      ctx.beginPath();
      ctx.arc(0, 0, eventHorizonRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#07080C';
      ctx.fill();

      // Photon Sphere Hairline Boundary
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(255, 193, 152, 0.85)';
      ctx.beginPath();
      ctx.arc(0, 0, eventHorizonRadius + 1, 0, Math.PI * 2);
      ctx.stroke();

      // Inner Ergosphere Micro Bloom
      const innerBloom = ctx.createRadialGradient(0, 0, eventHorizonRadius - 6, 0, 0, eventHorizonRadius + 8);
      innerBloom.addColorStop(0, 'rgba(0,0,0,1)');
      innerBloom.addColorStop(0.85, 'rgba(255, 154, 77, 0.45)');
      innerBloom.addColorStop(1, 'rgba(255, 154, 77, 0)');
      ctx.fillStyle = innerBloom;
      ctx.beginPath();
      ctx.arc(0, 0, eventHorizonRadius + 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  })();
</script></main>
